# Runs BOTH day-trading bots with FAKE money every weekday morning ($100 each),
# then saves the accounts and a results report back to this repo (paper/REPORT.md).
name: Paper trade

on:
  schedule:
    # GitHub schedules use UTC. These two cover 9:05am New York time in both
    # daylight saving (13:05 UTC) and standard time (14:05 UTC); the gate step
    # below makes sure only the right one actually trades. GitHub often starts
    # scheduled runs late, so we aim early and accept starts up to 10:45.
    - cron: "5 13 * * 1-5"
    - cron: "5 14 * * 1-5"
  workflow_dispatch: {}   # "Run workflow" button for a manual run

permissions:
  contents: write         # to save the account + report back to the repo

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # GitHub's max is 360
    steps:
      - name: Only run near the open (New York time)
        id: gate
        run: |
          NOW=$(TZ=America/New_York date +%H%M)
          echo "New York time: $NOW"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$NOW" -ge 0855 ] && [ "$NOW" -le 1045 ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Not market-open time - skipping."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: pip install pandas numpy yfinance

      - name: Trade (fake money) - both bots side by side
        if: steps.gate.outputs.go == 'true'
        run: |
          # save the accounts + REPORT.md every 10 minutes while the bots trade
          ( while sleep 600; do scripts/save_results.sh "Paper trading update $(TZ=America/New_York date '+%F %H:%M')" \
              paper/options_state.json paper/stocks_state.json; done ) &
          SAVER=$!
          python -u -m swing_bot options-trade --state paper/options_state.json \
            --cash 100 --budget-pct 0.5 --exit-time 14:45 2>&1 \
            | grep --line-buffered -v -i "crumb\|failed download\|delisted\|possibly" | sed -u 's/^/[options] /' &
          P1=$!
          python -u -m swing_bot stocks-trade --state paper/stocks_state.json \
            --cash 100 --budget-pct 0.5 --exit-time 14:45 2>&1 \
            | grep --line-buffered -v -i "crumb\|failed download\|delisted\|possibly" | sed -u 's/^/[stocks] /' &
          P2=$!
          wait $P1 $P2 || true
          kill $SAVER || true

      - name: Save results to the repo
        if: always() && steps.gate.outputs.go == 'true'
        run: scripts/save_results.sh "Paper trading results $(TZ=America/New_York date +%F)" paper/options_state.json paper/stocks_state.json
